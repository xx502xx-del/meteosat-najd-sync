<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Najd Sat - Advanced Satellite Weather</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'XQ55';
            src: url('xq55.ttf?v=1') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        html { width: 100%; height: 100%; }
        body { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #090d16;
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==========================================
           TOP NAVIGATION (BaroClinic Style -> Najd Sat)
           ========================================== */
        #top-nav {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 52px;
            background: #11151e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 40;
            border-bottom: 1px solid #1e2634;
            color: #f8fafc;
            gap: 12px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .logo {
            background: none;
            border: none;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sat-icon-wrap {
            position: relative;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sat-icon-svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #38bdf8;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: satFloat 4s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.6));
        }

        .sat-beam {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 5px;
            height: 5px;
            background: #22c55e;
            border-radius: 50%;
            animation: satPulse 1.8s infinite;
        }

        @keyframes satFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(4deg); }
        }

        @keyframes satPulse {
            0% { transform: scale(0.8); opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.6); opacity: 0; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.8); opacity: 0; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .logo-badge {
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #38bdf8;
            font-size: 13px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }

        /* ECMWF-IFS Style Satellite Selector Dropdown */
        .model-select-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .model-dropdown-btn {
            background: #1a2232;
            border: 1px solid #2b384e;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .model-dropdown-btn:hover {
            background: #222c40;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .model-dropdown-btn .pill-tag {
            background: #2563eb;
            color: #fff;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 700;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            width: 290px;
            background: #131924;
            border: 1px solid #232f42;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            padding: 6px 0;
            z-index: 100;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .dropdown-item:hover {
            background: #1e293b;
            color: #ffffff;
        }

        .dropdown-item.active {
            background: rgba(37, 99, 235, 0.15);
            color: #38bdf8;
            font-weight: 600;
        }

        .dropdown-item .item-meta {
            font-size: 11px;
            color: #64748b;
        }

        .dropdown-divider {
            height: 1px;
            background: #1e2634;
            margin: 4px 0;
        }

        /* ==========================================
           MAIN SATELLITE CANVAS / SCREEN
           ========================================== */
        #map-container {
            position: absolute;
            top: 52px;
            bottom: 58px;
            left: 0;
            right: 0;
            width: 100%;
            background: #070a12;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-stage {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100%;
        }

        #satellite-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: scale-down;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
            image-rendering: crisp-edges;
            border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(56, 189, 248, 0.12);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Top-Left Weather HUD (BaroClinic Style) */
        #layer-hud {
            position: absolute;
            top: 14px;
            left: 16px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 8px;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 10;
        }

        #hud-product-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #ffffff;
            margin-bottom: 3px;
        }

        .hud-sub {
            font-size: 11px;
            font-weight: 500;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        /* Top-Right Time HUD (داخل حدود صورة القمر دائماً) - نسخة الكمبيوتر */
        #time-hud {
            position: absolute;
            top: 8px;
            right: 10px;
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 3px 7px;
            border-radius: 5px;
            font-family: 'Roboto', monospace;
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 30;
            white-space: nowrap;
        }

        /* زر إظهار/إخفاء المدن — مربع صغير خفيف بهوية بصرية فاخرة أسفل شريط الوقت مباشرة */
        #btn-cities-toggle {
            position: absolute;
            top: 29px;
            right: 10px;
            width: 22px;
            height: 22px;
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(56, 189, 248, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 0;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), 0 0 10px rgba(56, 189, 248, 0.15);
            cursor: pointer;
            z-index: 35;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        #btn-cities-toggle .icon-emoji {
            font-size: 12px;
            line-height: 1;
            display: inline-block;
            transition: transform 0.2s ease;
        }

        #btn-cities-toggle:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        #btn-cities-toggle:hover .icon-emoji {
            transform: scale(1.1);
        }

        #btn-cities-toggle.is-hidden {
            opacity: 0.45;
            background: rgba(15, 23, 42, 0.55);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: none;
            filter: grayscale(0.8);
        }

        /* طبقة مسميات المدن المسقطة 100% بنظام النسب المئوية */
        /* طبقة الحدود الجغرافية الشفافة (معايرة بدقة 101.1% وشفافية 45%) */
        #borders-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            z-index: 1; /* في الطبقة الخلفية داخل الحاوية */
            opacity: 0.45;
            transform-origin: 75% 50%;
            transform: scaleX(1.009);
            transition: opacity 0.25s ease;
        }

        #cities-overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            line-height: normal;
            transition: opacity 0.25s ease, transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
        }

        #cities-overlay-layer.cities-hidden {
            opacity: 0;
            pointer-events: none;
        }

        #cities-overlay-layer.cities-hidden #borders-layer {
            opacity: 0;
        }

        .city-marker {
            position: absolute;
            pointer-events: none;
            transform-origin: 0 0;
            z-index: 20; /* تضمن ظهور النقط والمسميات فوق طبقة الحدود الشفافة بالكامل */
        }

        .city-node-item {
            position: relative;
            width: 6px;
            height: 6px;
        }

        .city-node-item .city-dot {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #000;
            border-radius: 50%;
            box-shadow: 0 0 2.5px rgba(0, 0, 0, 0.9), 0 0 1px rgba(0, 0, 0, 1);
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
        }

        .city-node-item .city-label {
            position: absolute;
            font-size: 8px;
            font-weight: 700;
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 1px 3px #000, 0 0 6px rgba(0, 0, 0, 0.9),
                        1px 0 0 rgba(0, 0, 0, 0.5), -1px 0 0 rgba(0, 0, 0, 0.5);
            font-family: 'XQ55', system-ui, -apple-system, sans-serif;
            white-space: nowrap;
            letter-spacing: 0.01em;
            pointer-events: none;
            transition: font-size 0.28s cubic-bezier(0.25, 1, 0.5, 1), top 0.28s cubic-bezier(0.25, 1, 0.5, 1), bottom 0.28s cubic-bezier(0.25, 1, 0.5, 1), left 0.28s cubic-bezier(0.25, 1, 0.5, 1), right 0.28s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* عند الزوم (التكبير 2X): تصغير الخط لـ 5px والنقطة لـ 55% مع تقريب المسميات للنقطة درجة إضافية بدقة */
        #cities-overlay-layer.is-zoomed .city-node-item .city-label {
            font-size: 5px;
        }

        #cities-overlay-layer.is-zoomed .city-node-item .city-dot {
            transform: scale(0.55);
        }

        #cities-overlay-layer.is-zoomed .city-label.pos-bottom {
            top: 6px;
        }

        #cities-overlay-layer.is-zoomed .city-label.pos-top {
            bottom: 6px;
        }

        #cities-overlay-layer.is-zoomed .city-label.pos-right {
            right: 7px;
        }

        #cities-overlay-layer.is-zoomed .city-label.pos-left {
            left: 7px;
        }

        .city-label.pos-bottom {
            left: -47px;
            top: 9px;
            width: 100px;
            text-align: center;
        }

        .city-label.pos-top {
            left: -47px;
            bottom: 9px;
            width: 100px;
            text-align: center;
        }

        .city-label.pos-right {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            text-align: left;
        }

        .city-label.pos-left {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            text-align: right;
        }

        /* ==========================================
           BOTTOM TIMELINE & CONTROLS (BaroClinic)
           ========================================== */
        #bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 58px;
            background: #11151e;
            border-top: 1px solid #1e2634;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            z-index: 30;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: #181d28;
            border: 1px solid #262f3f;
            color: #f8fafc;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .ctrl-btn:hover {
            background: #2563eb;
            border-color: #3b82f6;
            color: #ffffff;
        }

        .ctrl-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .speed-btn {
            background: #181d28;
            border: 1px solid #262f3f;
            color: #94a3b8;
            height: 36px;
            padding: 0 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .speed-btn:hover {
            color: #ffffff;
            border-color: #3b82f6;
        }

        .live-btn {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #4ade80;
            height: 36px;
            padding: 0 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .live-btn:hover {
            background: rgba(34, 197, 94, 0.25);
            border-color: #22c55e;
            color: #ffffff;
        }

        .live-btn-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }

        /* Timeline Slider Container */
        .timeline-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #time-label {
            font-family: 'Roboto', monospace;
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            background: #141922;
            border: 1px solid #1f2735;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            min-width: 36px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* Custom BaroClinic Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            touch-action: pan-x;
            user-select: none;
            -webkit-user-select: none;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #232b3c;
            border-radius: 3px;
            border: none;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            transition: transform 0.1s ease, background 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #60a5fa;
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #232b3c;
            border-radius: 3px;
            border: none;
        }

        input[type=range]::-moz-range-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        /* شريط التاريخ في نسخة الموبايل */
        #mobile-date-banner {
            display: none;
        }

        /* ==========================================
           RESPONSIVE MOBILE VIEW (شاشات الهواتف)
           تحويل الشريط السفلي إلى شريط زجاجي عائم (Floating Glassmorphism Bar)
           مع الحفاظ على نسخة الكمبيوتر كاملة وكافة السرعات والآليات
           ========================================== */
        @media (max-width: 768px) {
            html, body {
                overflow-x: hidden;
                overflow-y: auto;
                overscroll-behavior-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #top-nav {
                height: 48px;
                padding: 0 12px;
            }

            body {
                overflow-x: hidden;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
            }

            #map-container {
                position: relative;
                top: 0;
                margin-top: 52px;
                padding: 6px 12px 0 12px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                box-sizing: border-box;
                width: 100%;
                flex-shrink: 0;
            }

            #mobile-date-banner {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                background: rgba(17, 24, 39, 0.72);
                border: 1px solid rgba(56, 189, 248, 0.25);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-radius: 20px;
                padding: 4px 12px;
                margin: 4px auto 8px auto;
                font-size: 10.5px;
                font-weight: 500;
                color: #e0f2fe;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 0 0 10px rgba(56, 189, 248, 0.1);
                direction: rtl;
                letter-spacing: 0.1px;
                z-index: 20;
            }

            #mobile-date-banner .cal-icon {
                font-size: 11px;
                filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.5));
            }

            .image-stage {
                display: inline-block;
                position: relative;
                overflow: hidden;
                border: 1px solid rgba(56, 189, 248, 0.28) !important;
                border-radius: 8px;
                box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(56, 189, 248, 0.12) !important;
                background: #070a12;
                line-height: 0;
                touch-action: none !important;
                user-select: none;
                -webkit-user-select: none;
            }

            #satellite-image {
                max-width: 100%;
                max-height: calc(100vh - 240px);
                width: auto;
                height: auto;
                object-fit: scale-down;
                border-radius: 0 !important;
                border: none !important;
                box-shadow: none !important;
                outline: none !important;
                box-sizing: border-box;
                display: block;
                transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
                cursor: zoom-in;
                touch-action: none !important;
                user-select: none;
                -webkit-user-select: none;
                -webkit-tap-highlight-color: transparent;
            }

            #satellite-image.is-zoomed {
                cursor: zoom-out;
            }

            /* الشريط الزجاجي أسفل صورة القمر بمسافة سطرين واضحة ومستقلة */
            #bottom-panel {
                position: relative;
                margin: 22px 12px 28px 12px; /* مسافة سطرين (22px) تفصله بوضوح عن أسفل الصورة */
                height: auto;
                background: rgba(17, 21, 30, 0.85);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(56, 189, 248, 0.25);
                border-radius: 16px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75), 0 0 15px rgba(56, 189, 248, 0.1);
                flex-direction: column;
                justify-content: center;
                align-items: stretch;
                padding: 10px 14px;
                gap: 8px;
                z-index: 40;
                width: calc(100% - 24px);
                max-width: 440px;
                box-sizing: border-box;
                flex-shrink: 0;
            }

            .controls-group {

                width: 100%;

                width: 36px;
                height: 36px;
            }

                width: 100%;
                gap: 8px;

                top: 4px !important;
                right: 4px !important;
                padding: 1px 3px !important;
                font-size: 6px !important;
                transform: scale(0.85);
                transform-origin: top right;
                border-radius: 3px !important;
                letter-spacing: 0px !important;
                background: rgba(15, 23, 42, 0.75) !important;
                border: 1px solid rgba(255, 255, 255, 0.12) !important;
                line-height: 1.15 !important;
                z-index: 30 !important;
            }

            /* زر المدن في الجوال: مربع أنيق خفيف أسفل بوكس الوقت مباشرة */
            #btn-cities-toggle {
                top: 19px !important;
                right: 4px !important;
                width: 17px !important;
                height: 17px !important;
                padding: 0 !important;
                border-radius: 3px !important;
                transform: none !important;
                z-index: 35 !important;
            }

            #btn-cities-toggle .icon-emoji {
                font-size: 9.5px !important;
            }

            /* تحسين زر قائمة الأقمار في الجوال ليظل ثابتاً ولا يرتفع أو يشوه الهيدر */
            .model-dropdown-btn {
                padding: 4px 8px;
                font-size: 11px;
                gap: 5px;
                max-width: 165px;
            }

            #current-model-name {
                display: inline-block;
                max-width: 105px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                vertical-align: middle;
            }

            .logo-badge {
                font-size: 11px;
                padding: 3px 6px;
                letter-spacing: 0.8px;
            }
        }

    modelBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('show');
    });

    document.addEventListener('click', () => {
        dropdown.classList.remove('show');
    });

    // Switch Satellite via Dropdown with exact Time Synchronization
    document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            
            const prevSat = currentSat;
            const prevList = nonaData[prevSat] || [];
            const currentTimeStr = (prevList[currentIndex]) ? (prevList[currentIndex].date + ' ' + prevList[currentIndex].time) : null;

            currentSat = item.getAttribute('data-sat');
            currentModelName.textContent = item.getAttribute('data-label');
            
            const list = nonaData[currentSat] || [];
            timelineSlider.max = Math.max(0, list.length - 1);

            // الانتقال الفوري والتلقائي إلى آخر تحديث حي للقمر المختار
            currentIndex = Math.max(0, list.length - 1);

            showFrame(currentIndex);

        });
    });

    // ==========================================
    // محرك التحميل المسبق الصامت الفائق (Instant Cache Engine)
    // ==========================================
    const imageCache = {};

    function preloadSatImages(satKey) {
        const list = nonaData[satKey] || [];
        if (!list || list.length === 0) return;
        if (!imageCache[satKey]) imageCache[satKey] = {};

        // الأولوية 1: تحميل أحدث 15 صورة فوراً لتكون الحركة سلسة كالبرق
        for (let i = list.length - 1; i >= Math.max(0, list.length - 15); i--) {
            const f = list[i].file;
            if (!imageCache[satKey][f]) {
                const img = new Image();
                img.src = f;
                imageCache[satKey][f] = img;
            }
        }

        // الأولوية 2: تحميل باقي صور الـ 12 ساعة في الخفاء بتتابع هادئ
        let remainingIdx = list.length - 16;
        const bgTimer = setInterval(() => {
            if (remainingIdx < 0) {
                clearInterval(bgTimer);
                return;
            }
            const f = list[remainingIdx].file;
            if (!imageCache[satKey][f]) {
                const img = new Image();
                img.src = f;
                imageCache[satKey][f] = img;
            }
            remainingIdx--;
        }, 150);
    }

    function showFrame(index) {
        const list = nonaData[currentSat] || [];
        if (!list || list.length === 0) return;
        currentIndex = Math.max(0, Math.min(index, list.length - 1));

        const frame = list[currentIndex];
        satImg.src = frame.file;
        timeHud.textContent = frame.date + ' ' + frame.time;
        timeLabel.textContent = frame.time.replace(' KSA', '');
        timelineSlider.value = currentIndex;
    }

    function togglePlay() {
        if (isPlaying) {
            clearInterval(playInterval);
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        } else {
            isPlaying = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            startLoop();
        }
    }

    function startLoop() {
        clearInterval(playInterval);
        playInterval = setInterval(() => {
            const list = nonaData[currentSat] || [];
            if (!list || list.length === 0) return;
            let nextIndex = currentIndex + 1;
            if (nextIndex >= list.length) {
                nextIndex = 0;
            }
            showFrame(nextIndex);
        }, speeds[speedIndex]);
    }

    btnPlay.addEventListener('click', togglePlay);
    btnPrev.addEventListener('click', () => { if (isPlaying) togglePlay(); showFrame(currentIndex - 1); });
    btnNext.addEventListener('click', () => { if (isPlaying) togglePlay(); showFrame(currentIndex + 1); });
    btnLatest.addEventListener('click', () => {
        if (isPlaying) {
            togglePlay(); // إيقاف الحركة المؤقتة للتثبيت عند البث المباشر
        }
        const list = nonaData[currentSat] || [];
        showFrame(list.length - 1);
    });

    timelineSlider.addEventListener('input', (e) => {
        if (isPlaying) togglePlay();
        showFrame(parseInt(e.target.value));
    });

    timelineSlider.addEventListener('change', (e) => {
        if (isPlaying) togglePlay();
        showFrame(parseInt(e.target.value));
    });

    // تحسين استجابة اللمس على الجوال لمنع تعليق أو تداخل السحب
    timelineSlider.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        if (isPlaying) togglePlay();
    }, { passive: true });

    timelineSlider.addEventListener('touchmove', (e) => {
        e.stopPropagation();
    }, { passive: true });

    btnSpeed.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % speeds.length;
        btnSpeed.textContent = speedLabels[speedIndex];
        if (isPlaying) startLoop();
    });

    // ==========================================
    // حماية الخصوصية: تعطيل كليك يمين واختصارات الفحص لمنع معرفة مسارات الصور
    // ==========================================
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
        // منع F12 واختصارات فحص العناصر وعرض السورس (Ctrl+U, Ctrl+Shift+I, Cmd+Opt+I)
        if (e.key === 'F12' || 
            ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) ||
            ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) ||
            (e.metaKey && e.altKey && (e.key === 'i' || e.key === 'I' || e.key === 'u' || e.key === 'U' || e.key === 'c' || e.key === 'C'))) {
            e.preventDefault();
            return false;
        }
    });

    // ميزة التكبير الذكي مع إمكانية السحب المحكوم بدقة داخل الإطار بدون كشف أي سواد للجوال فقط
    let isZoomed = false;
    let panStartX = 0, panStartY = 0;
    let currentPanX = 0, currentPanY = 0;
    let startPanX = 0, startPanY = 0;
    let isPanning = false;
    let hasMoved = false;
    let touchStartTime = 0;

    function applyBoundedPan() {
        // حساب الأبعاد الفعلية الدقيقة المعروضة لصورة القمر نفسها
        const imgW = satImg.offsetWidth || satImg.clientWidth;
        const imgH = satImg.offsetHeight || satImg.clientHeight;
        // عند scale(2.0)، كل نصف يتمدد بمقدار imgW/2 أو imgH/2. نقسم على 2 لتعويض translate(x / 2.0)
        // وبذلك أقصى إزاحة مطابقة لـ 100% من أطراف الصورة دون السماح بأي بكسل فراغ خارجي إطلاقاً
        const limitX = imgW / 2;
        const limitY = imgH / 2;

        if (currentPanX > limitX) currentPanX = limitX;
        if (currentPanX < -limitX) currentPanX = -limitX;
        if (currentPanY > limitY) currentPanY = limitY;
        if (currentPanY < -limitY) currentPanY = -limitY;

        satImg.style.transform = "scale(2.0) translate(" + (currentPanX / 2.0) + "px, " + (currentPanY / 2.0) + "px)";
        if (citiesLayer) {
            citiesLayer.style.transform = "scale(2.0) translate(" + (currentPanX / 2.0) + "px, " + (currentPanY / 2.0) + "px)";
        }
    }

    satImg.addEventListener("touchstart", (e) => {
        if (window.innerWidth > 768) return;
        if (e.touches.length === 1) {
            touchStartTime = Date.now();
            hasMoved = false;
            panStartX = e.touches[0].clientX;
            panStartY = e.touches[0].clientY;
            startPanX = currentPanX;
            startPanY = currentPanY;
            if (isZoomed) {
                isPanning = true;
                satImg.style.transition = "none";
                if (citiesLayer) citiesLayer.style.transition = "none";
            }
        }
    }, { passive: false });

    window.addEventListener("touchmove", (e) => {
        if (!isPanning || !isZoomed) return;
        if (e.touches.length === 1) {
            const dx = e.touches[0].clientX - panStartX;
            const dy = e.touches[0].clientY - panStartY;
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                hasMoved = true;
                if (e.cancelable) e.preventDefault();
            }
            currentPanX = startPanX + dx;
            currentPanY = startPanY + dy;
            applyBoundedPan();
        }
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
        if (!isPanning) return;
        isPanning = false;
        satImg.style.transition = "transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)";
        if (citiesLayer) citiesLayer.style.transition = "transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)";
    });

    satImg.addEventListener("click", (e) => {
        if (window.innerWidth > 768) return;
        const touchDuration = Date.now() - touchStartTime;

        // إذا كان المستخدم في وضع الزوم وقام بأي تحريك أو استمرت لمسته أكثر من 200 ميلي ثانية، نمنع إلغاء الزوم نهائياً!
        if (isZoomed && (hasMoved || touchDuration > 200)) {
            return;
        }

        if (!isZoomed) {
            const stage = satImg.parentElement;
            const stageRect = stage.getBoundingClientRect();
            // مركز التقريب يتم حسابه نسبة لنقطة لمس المستخدم ليكون سلس ومحكوم
            const touchRelX = e.clientX - (stageRect.left + stageRect.width / 2);
            const touchRelY = e.clientY - (stageRect.top + stageRect.height / 2);
            satImg.style.transformOrigin = "center center";
            if (citiesLayer) citiesLayer.style.transformOrigin = "center center";
            currentPanX = -touchRelX;
            currentPanY = -touchRelY;
            satImg.style.transition = "transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)";
            if (citiesLayer) citiesLayer.style.transition = "transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)";
            applyBoundedPan();
            satImg.classList.add("is-zoomed");
            if (citiesLayer) citiesLayer.classList.add("is-zoomed");
            isZoomed = true;
        } else {
            // نقرة سريعة وخاطفة فقط هي التي تعيد الصورة لوضعها الطبيعي
            satImg.style.transition = "transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)";
            satImg.style.transform = "scale(1.0) translate(0px, 0px)";
            satImg.classList.remove("is-zoomed");
            if (citiesLayer) {
                citiesLayer.style.transition = "transform 0.28s cubic-bezier(0.25, 1, 0.5, 1)";
                citiesLayer.style.transform = "scale(1.0) translate(0px, 0px)";
                citiesLayer.classList.remove("is-zoomed");
            }
            setTimeout(() => {
                satImg.style.transformOrigin = "center center";
                satImg.style.transform = "";
                if (citiesLayer) {
                    citiesLayer.style.transformOrigin = "center center";
                    citiesLayer.style.transform = "";
                }
                currentPanX = 0;
                currentPanY = 0;
            }, 280);
            isZoomed = false;
        }
    });

    // دعم سحب الشاشة للأسفل للتحديث (Native & Smooth Pull-to-Refresh)
    let touchStartY = 0;
    let touchStartX = 0;
    let isPulling = false;

    window.addEventListener('touchstart', (e) => {
        // إذا كان المستخدم في وضع الزوم أو يلمس داخل صورة القمر، نعطل ميزة سحب التحديث تماماً لمنع الخروج
        if (isZoomed || e.target.closest('.image-stage')) return;
        if (e.touches.length === 1 && window.scrollY <= 5) {
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
            isPulling = true;
        }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (isZoomed || !isPulling || e.touches.length !== 1) return;
        const currentY = e.touches[0].clientY;
        const currentX = e.touches[0].clientX;
        const deltaY = currentY - touchStartY;
        const deltaX = Math.abs(currentX - touchStartX);

        // إذا كانت الحركة سحباً عمودياً واضحاً للأسفل من أعلى الصفحة بأكثر من 130 بكسل
        if (deltaY > 130 && deltaX < 60 && window.scrollY <= 0) {
            isPulling = false;
            // وميض خفيف ينبّه المستخدم بالتحديث الفوري
            document.body.style.opacity = '0.6';
            document.body.style.transition = 'opacity 0.2s ease';
            setTimeout(() => {
                window.location.reload();
            }, 150);
        }
    }, { passive: true });

    window.addEventListener('touchend', () => {
        isPulling = false;
    }, { passive: true });

    // تحديث التاريخ الهجري والميلادي لنسخة الموبايل تلقائياً
    function updateMobileDate() {
        try {
            const now = new Date();
            const hijriFmt = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            const gregFmt = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            const dateStr = (hijriFmt.format(now) + ' الموافق ' + gregFmt.format(now) + ' م').replace('،', '');
            const el = document.getElementById('mobile-date-text');
            if (el) el.textContent = dateStr;
        } catch(e) {}
    }
    updateMobileDate();

    // Start at latest frame without auto-play
    showFrame(currentIndex);
    preloadSatImages(currentSat); // بدء التحميل المسبق الصامت للقمر الافتراضي فور فتح الصفحة

    // ==========================================
    // البث المباشر الدائم (Always LIVE) - نظام بداية المشروع الأصلي التلقائي
    // ==========================================
    let isLiveTracking = true; // وضع المباشر نشط دائماً طالما لم يشغل المستخدم اللوب

    timelineSlider.addEventListener('input', () => {
        const list = nonaData[currentSat] || [];
        // إذا رجع المشاهد يدوياً لآخر فريم، يعود المباشر للعمل فوراً
        isLiveTracking = (parseInt(timelineSlider.value) >= list.length - 1);
    });

    btnLatest.addEventListener('click', () => {
        isLiveTracking = true;
    });

    async function checkLatestSatFrames() {
        try {
            const res = await fetch('nona_manifest.json?t=' + Date.now());
            if (res.ok) {
                const freshData = await res.json();
                let hasUpdate = false;
                
                for (const satKey of Object.keys(freshData)) {
                    const currentLen = (nonaData[satKey] || []).length;
                    const freshLen = (freshData[satKey] || []).length;
                    if (freshLen !== currentLen || (freshLen > 0 && currentLen > 0 && freshData[satKey][freshLen - 1].file !== nonaData[satKey][currentLen - 1].file)) {
                        hasUpdate = true;
                        nonaData[satKey] = freshData[satKey];
                    }
                }

                if (hasUpdate) {
                    const list = nonaData[currentSat] || [];
                    timelineSlider.max = Math.max(0, list.length - 1);

                    // وميض أخضر على زر LIVE
                    btnLatest.style.boxShadow = '0 0 15px #22c55e';
                    btnLatest.style.borderColor = '#22c55e';
                    setTimeout(() => {
                        btnLatest.style.boxShadow = '';
                        btnLatest.style.borderColor = '';
                    }, 3000);

                    // في وضع البث المباشر (Always LIVE): تظهر أحدث صورة فوراً بدون أي شروط!
                    if (!isPlaying && isLiveTracking) {
                        currentIndex = list.length - 1;
                        showFrame(currentIndex);
                    }
                }
            }
        } catch (e) {}
    }

    // فحص راداري سريع كل 15 ثانية
    setInterval(checkLatestSatFrames, 15000);

    // إذا عاد المستخدم للصفحة أو استيقظ الهاتف من السكون، يفحص فوراً ويجلب أحدث صورة حية لحظياً
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !isPlaying && isLiveTracking) {
            checkLatestSatFrames();
        }
    });
    window.addEventListener('focus', () => {
        if (!isPlaying && isLiveTracking) {
            checkLatestSatFrames();
        }
    });

    // ══════════════════════════════════════════════════════════════════
    // طبقة المدن الـ 35 المعتمدة بالمليمتر مع زر التبديل
    // ══════════════════════════════════════════════════════════════════
    const VERIFIED_CITIES = [
        { "id": "hail", "name": "حائل", "x": 201, "y": 72, "pos": "top" },
        { "id": "hafr", "name": "الحفر", "x": 422, "y": 23, "pos": "bottom" },
        { "id": "dawasir", "name": "الوادي", "x": 360, "y": 477, "pos": "top" },
        { "id": "city_1", "name": "أبها", "x": 244, "y": 600, "pos": "top" },
        { "id": "city_2", "name": "الباحة", "x": 187, "y": 500, "pos": "right" },
        { "id": "city_3", "name": "تثليث", "x": 281, "y": 529, "pos": "left" },
        { "id": "city_4", "name": "يبرين", "x": 582, "y": 317, "pos": "bottom" },
        { "id": "city_5", "name": "الهفوف", "x": 614, "y": 195, "pos": "bottom" },
        { "id": "city_6", "name": "الدوحة", "x": 716, "y": 198, "pos": "bottom" },
        { "id": "city_7", "name": "المنامة", "x": 665, "y": 143, "pos": "left" },
        { "id": "city_8", "name": "الدمام", "x": 637, "y": 133, "pos": "right" },
        { "id": "city_9", "name": "الهضب", "x": 316, "y": 425, "pos": "top" },
        { "id": "city_10", "name": "بيشة", "x": 239, "y": 492, "pos": "bottom" },
        { "id": "city_11", "name": "عفيف", "x": 261, "y": 281, "pos": "right" },
        { "id": "city_12", "name": "الزبيرة", "x": 303, "y": 46, "pos": "top" },
        { "id": "city_13", "name": "العقلة", "x": 224, "y": 171, "pos": "right" },
        { "id": "city_14", "name": "ظلم", "x": 225, "y": 350, "pos": "right" },
        { "id": "city_15", "name": "جدة", "x": 62, "y": 411, "pos": "right" },
        { "id": "city_16", "name": "مكة", "x": 100, "y": 421, "pos": "top" },
        { "id": "city_17", "name": "الطائف", "x": 134, "y": 427, "pos": "left" },
        { "id": "city_18", "name": "الافلاج", "x": 464, "y": 374, "pos": "top" },
        { "id": "city_19", "name": "تيماء", "x": 31, "y": 64, "pos": "top" },
        { "id": "city_20", "name": "المدينة", "x": 91, "y": 247, "pos": "top" },
        { "id": "city_21", "name": "رابغ", "x": 60, "y": 341, "pos": "bottom" },
        { "id": "city_22", "name": "ينبع", "x": 12, "y": 264, "pos": "left" },
        { "id": "city_23", "name": "رنية", "x": 271, "y": 424, "pos": "bottom" },
        { "id": "city_24", "name": "الخفجي", "x": 551, "y": 17, "pos": "left" },
        { "id": "city_25", "name": "الحصاة", "x": 352, "y": 356, "pos": "left" },
        { "id": "city_26", "name": "الرين", "x": 388, "y": 293, "pos": "right" },
        { "id": "city_27", "name": "الرياض", "x": 464, "y": 236, "pos": "top" },
        { "id": "city_28", "name": "الحوطة", "x": 471, "y": 304, "pos": "left" },
        { "id": "city_29", "name": "الخرخير", "x": 694, "y": 559, "pos": "right" },
        { "id": "city_30", "name": "المجمعة", "x": 392, "y": 169, "pos": "left" },
        { "id": "city_31", "name": "الدوادمي", "x": 339, "y": 245, "pos": "left" },
        { "id": "city_32", "name": "عنيزة", "x": 319, "y": 155, "pos": "top" }
    ];

    const citiesContainer = document.getElementById('cities-overlay-layer');
    const btnCitiesToggle = document.getElementById('btn-cities-toggle');
    let citiesVisible = true;

    if (citiesContainer) {
        // الحفاظ على عنصر صورة الحدود بداخل طبقة المدن للتزامن التام
        let bordersImgEl = document.getElementById('borders-layer');
        citiesContainer.innerHTML = '';
        if (bordersImgEl) {
            citiesContainer.appendChild(bordersImgEl);
        } else {
            bordersImgEl = document.createElement('img');
            bordersImgEl.id = 'borders-layer';
            bordersImgEl.src = BORDERS_BASE64_URI;
            bordersImgEl.alt = 'Borders Overlay';
            citiesContainer.appendChild(bordersImgEl);
        }
        VERIFIED_CITIES.forEach(city => {
            const marker = document.createElement('div');
            marker.className = 'city-marker';
            const pctX = (city.x / 760) * 100;
            const pctY = (city.y / 616) * 100;
            marker.style.left = pctX + '%';
            marker.style.top = pctY + '%';
            marker.innerHTML = `
                <div class="city-node-item" style="transform: translate(-3px, -3px);">
                    <div class="city-dot"></div>
                    <div class="city-label pos-${city.pos}">${city.name}</div>
                </div>
            `;
            citiesContainer.appendChild(marker);
        });
    }

    if (btnCitiesToggle) {
        btnCitiesToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            citiesVisible = !citiesVisible;
            if (citiesVisible) {
                citiesContainer.classList.remove('cities-hidden');
                btnCitiesToggle.classList.remove('is-hidden');
            } else {
                citiesContainer.classList.add('cities-hidden');
                btnCitiesToggle.classList.add('is-hidden');
            }
        });
    }
</script>
