name: 🛰️ Meteosat Najd 24/7 Cloud Auto-Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 جلب كود المشروع
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 تثبيت Chromium الكامل مع Puppeteer
        run: |
          npm init -y
          npx @puppeteer/browsers install chrome@stable
          npm install puppeteer

      - name: 🌐 تنفيذ السحب السحابي وتحديث Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_OAUTH_TOKEN: ${{ secrets.CLOUDFLARE_OAUTH_TOKEN }}
          CLOUDFLARE_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}
        run: |
          node sync_in_cloud.js
