name: 🛰️ Meteosat Najd 24/7 Cloud Auto-Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 جلب كود المشروع
        uses: actions/checkout@v4

      - name: ⚙️ إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 تثبيت Chromium الكامل مع Puppeteer
        run: |
          npm init -y
          npx @puppeteer/browsers install chrome@stable
          npm install puppeteer

      - name: 🌐 تنفيذ السحب السحابي وتحديث Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_OAUTH_TOKEN: ${{ secrets.CLOUDFLARE_OAUTH_TOKEN }}
          CLOUDFLARE_REFRESH_TOKEN: ${{ secrets.CLOUDFLARE_REFRESH_TOKEN }}
        run: |
          node sync_in_cloud.js

      - name: 🔄 تشغيل حلقة المزامنة التالية فوراً لضمان التدفق الصاروخي المستمر
        if: always()
        run: |
          sleep 180 # انتظار 3 دقائق ثم إطلاق الفحص التالي تلقائياً
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GH_ACTION_TOKEN }}" \
            https://api.github.com/repos/xx502xx-del/meteosat-najd-sync/actions/workflows/sat_sync_247.yml/dispatches \
            -d '{"ref":"main"}' || true
